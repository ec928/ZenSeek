<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <base href='https://localapp/'>
    <style id='dynamic-theme'>
        {{DYNAMIC_CSS}}
    </style>
    <style>
        body { 
            {{PAGE_CSS}} 
        } 
        body::before { 
            content: ''; 
            display: block; 
            height: 35px; 
            width: 100%; 
        } 
        body::-webkit-scrollbar { 
            width: 10px; 
            height: 10px; 
        } 
        body::-webkit-scrollbar-thumb { 
            background-color: rgba(128,128,128,0.4); 
            border-radius: 5px; 
        } 
        .page-break { 
            break-before: column; 
            break-after: column; 
            page-break-after: always; 
            display: block; 
            width: 100%; 
            height: 1px; 
            margin: 0; 
            border: none; 
        } 
        {{RESPONSIVE_CSS}} 
        {{PADDING_CSS}} 
        .tl { min-height: 1.2em; overflow-wrap: break-word; margin-bottom: 2px; } 
        table { border-collapse: collapse; width: 100%; margin: 15px 0; table-layout: fixed; } 
        th, td { border: 1px solid; padding: 10px; text-align: left; } 
        mark { border-radius: 3px; padding: 0 2px; } 
        .active-line { background-color: rgba(128,128,128,0.25) !important; border-radius: 3px; } 
        pre, code { font-family: Consolas, monospace; background: rgba(128,128,128,0.15); padding: 2px 5px; border-radius: 4px; } 
        .code-line { font-family: Consolas, monospace; white-space: pre-wrap; background: rgba(128,128,128,0.08); border-left: 3px solid rgba(128,128,128,0.3); padding-left: 8px; } 
        h2 { padding-bottom: 2px; margin-top: 10px; margin-bottom: 2px; font-weight: 600; } 
        .li { display: flex; margin-left: 10px; padding-bottom: 2px; } 
        .bullet { flex-shrink: 0; min-width: 14px; text-align: right; margin-right: 8px; white-space: nowrap; }
        .li-text { min-width: 0; flex: 1; }
    </style>
    {{JS_BLOCK}}
</head>
<body>
    {{BODY_HTML}}
</body>
</html>
